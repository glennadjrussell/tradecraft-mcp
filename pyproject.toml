[project]
name = "tradecraft-mcp"
version = "0.1.0"
description = "OSINT tradecraft toolkit exposed as an MCP server"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "asyncwhois>=1.1.12",
    "beautifulsoup4>=4.14.3",
    "dnspython>=2.8.0",
    "fastmcp>=3.2.0",
    "google-auth>=2.49.1",
    "lxml>=6.0.2",
    "mcp[cli]>=1.26.0",
    "requests>=2.32.5",
    "shodan>=1.31.0",
]

[project.scripts]
tradecraft-mcp = "tradecraft_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradecraft_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.2",
]
